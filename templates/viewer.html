<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Recording Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        window.APP_ROOT = "{{ url_for('index').rstrip('/') }}";
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 18px;
            display: flex;
            justify-content: center;
        }
        .main-wrapper {
            width: min(100%, 700px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .header-card, .text-card, .record-card {
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.18);
        }
        .header-card {
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .index-badge {
            font-size: 1.4rem;
            font-weight: 700;
            color: #facc15;
        }
        #status-bar {
            margin-top: 6px;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .logout-btn {
            text-decoration: none;
            color: #ef4444;
            padding: 8px 14px;
            border: 1px solid rgba(239,68,68,0.35);
            border-radius: 6px;
            background: rgba(239,68,68,0.1);
            font-weight: 700;
        }
        .text-card {
            padding: 18px;
        }
        .text-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #9ca3af;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #sample-text {
            margin-top: 8px;
            font-size: 1.25rem;
            line-height: 1.5;
        }
        .record-card {
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        #record-btn {
            width: min(100%, 300px);
            min-height: 130px;
            border-radius: 18px;
            border: 2px solid #444;
            background: #1f2937;
            color: #d1d5db;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        #record-btn.enabled {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border-color: #166534;
            color: white;
            box-shadow: 0 0 18px rgba(34,197,94,0.45);
        }
        #record-btn.pressed {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border-color: #7f1d1d;
            box-shadow: 0 0 18px rgba(239,68,68,0.5);
        }
        #record-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .debug-box {
            width: 100%;
            background: #151515;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px 14px;
            color: #d1d5db;
            font-size: 0.9rem;
            text-align: center;
        }
        #viewer-audio {
            width: 100%;
            display: none;
        }
        @media (max-width: 480px) {
            #record-btn { min-height: 110px; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="header-card">
            <div>
                <div class="index-badge">Index: <span id="current-index">0</span></div>
                <div id="status-bar">Waiting for admin...</div>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>

        <div class="text-card">
            <div class="text-label">Prompt</div>
            <div id="sample-text">Loading...</div>
        </div>

        <div class="record-card">
            <button id="record-btn" class="enabled">Hold to Record</button>
            <div id="viewer-status" class="debug-box">Ready</div>
            <audio id="viewer-audio" controls></audio>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/viewer_main.js') }}"></script>
</body>
</html>
